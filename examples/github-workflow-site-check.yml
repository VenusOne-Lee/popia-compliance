# Copy to .github/workflows/popia-site-check.yml in your repository.
# Re-checks your live site every Monday with the passive POPIA site check, writes the
# report to the job summary, and fails the run on high or critical findings, so GitHub
# emails you. Point it only at a site you own or may test.
# Findings are leads for review, not legal conclusions. Engineering guidance only.
name: POPIA site check

on:
  schedule:
    - cron: "0 6 * * 1"   # 08:00 SAST every Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - name: POPIA site check
        id: popia
        # Replace @main with the commit SHA of a release that includes site-url, as for any action.
        uses: VenusOne-Lee/popia-compliance@main
        with:
          scan: "false"
          site-url: https://example.co.za/
          site-fail-on: high
