[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "popia-kit"
version = "1.2.0"
description = "POPIA Kit: scanner, site check, Supabase check, compliance pack generator and MCP server for South African builders. Engineering guidance, not legal advice."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT (code); CC BY 4.0 (guidance and templates)"}
authors = [{name = "Venus ARC (Pty) Ltd, trading as Venus One"}]
keywords = ["popia", "privacy", "south africa", "data protection", "security", "compliance", "scanner", "supabase", "mcp"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://popiakit.co.za"
"Site check" = "https://popiakit.co.za/check"
Repository = "https://github.com/VenusOne-Lee/popia-compliance"
Documentation = "https://github.com/VenusOne-Lee/popia-compliance/blob/main/docs/quickstart.md"
Changelog = "https://github.com/VenusOne-Lee/popia-compliance/blob/main/CHANGELOG.md"
Security = "https://github.com/VenusOne-Lee/popia-compliance/blob/main/SECURITY.md"
Issues = "https://github.com/VenusOne-Lee/popia-compliance/issues"

[project.scripts]
popia-kit = "popia_kit.cli:main"
popia-init = "popia_kit.cli:run_init"
popia-scan = "popia_kit.cli:run_scan"
popia-operators = "popia_kit.cli:run_operators"
popia-site-check = "popia_kit.cli:run_site_check"
popia-supabase = "popia_kit.cli:run_supabase"
popia-pack = "popia_kit.cli:run_pack"
popia-badge = "popia_kit.cli:run_badge"
popia-mcp = "popia_kit.cli:run_mcp"

[tool.setuptools]
# The repo keeps its clone-and-run layout. Packaging maps it into popia_kit.
packages = [
  "popia_kit",
  "popia_kit.rules",
  "popia_kit.mcp",
  "popia_kit.data.references",
  "popia_kit.data.packs",
  "popia_kit.data.templates",
  "popia_kit.data.adapters",
  "popia_kit.data.examples",
]
include-package-data = false

[tool.setuptools.package-dir]
"popia_kit" = "scripts"
"popia_kit.rules" = "scripts/rules"
"popia_kit.mcp" = "mcp"
"popia_kit.data.references" = "references"
"popia_kit.data.packs" = "packs"
"popia_kit.data.templates" = "templates"
"popia_kit.data.adapters" = "adapters"
"popia_kit.data.examples" = "examples"

[tool.setuptools.package-data]
"popia_kit" = ["sql/*.sql"]
"popia_kit.mcp" = ["tools.json"]
"popia_kit.data.references" = ["*.md"]
"popia_kit.data.packs" = ["*.md"]
"popia_kit.data.templates" = ["*.md", "*.csv", "*.json"]
"popia_kit.data.adapters" = [
  "claude/CLAUDE.md",
  "agents/AGENTS.md",
  "gemini/GEMINI.md",
  "cursor/.cursor/rules/popia.mdc",
  "copilot/.github/copilot-instructions.md",
  "windsurf/.windsurf/rules/popia.md",
]
"popia_kit.data.examples" = ["github-workflow-popia-scan.yml"]
