name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.8 is not available on ubuntu-24.04 images, so pin 22.04 for it.
        include:
          - python: "3.8"
            os: ubuntu-22.04
          - python: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -t . -v

      - name: Scanner rules load
        run: python3 scripts/popia_scan.py --list-rules

      - name: Scanner self-test on fixtures
        if: ${{ hashFiles('tests/fixtures/**') != '' }}
        run: |
          python3 scripts/popia_scan.py tests/fixtures --format json --out scan-fixtures.json
          python3 -c "import json; r=json.load(open('scan-fixtures.json')); assert r['files_scanned'] > 0, r; print(r['summary'])"

      - name: Evals (dry run)
        if: ${{ hashFiles('evals/run_evals.py') != '' }}
        run: python3 evals/run_evals.py --dry-run

      - name: Registry build check
        if: ${{ hashFiles('registry/build.py') != '' }}
        run: python3 registry/build.py --check

      - name: MCP smoke test
        run: python3 mcp/smoke_test.py

      - name: Badge from fixture scan
        if: ${{ hashFiles('tests/fixtures/**') != '' }}
        run: python3 scripts/popia_badge.py scan-fixtures.json --out badge.svg

      - name: Regwatch parser on fixture (offline)
        run: python3 scripts/regwatch.py --dry-run --offline-fixture tests/automation/fixtures/regulator-list.html

      - name: Adapters match the core
        run: python3 scripts/build_adapters.py --check

      - name: Style lint
        if: ${{ hashFiles('scripts/style_lint.py') != '' }}
        run: python3 scripts/style_lint.py

  package:
    name: One-line install (pip, pipx and npx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install the package into a clean venv
        run: |
          python -m venv /tmp/pk
          /tmp/pk/bin/pip install .

      - name: Installed commands work outside the repo
        working-directory: /tmp
        run: |
          /tmp/pk/bin/popia-kit version
          /tmp/pk/bin/popia-kit scan "$GITHUB_WORKSPACE/tests/fixtures/demo-app" --format json --out /tmp/scan.json || true
          python -c "import json; r=json.load(open('/tmp/scan.json')); assert r['files_scanned'] > 0 and len(r['findings']) > 0, r['summary']"
          /tmp/pk/bin/popia-kit pack --example /tmp/ex.json
          /tmp/pk/bin/popia-kit pack --answers /tmp/ex.json --out /tmp/pack
          test -f /tmp/pack/privacy-notice.md
          /tmp/pk/bin/popia-kit badge /tmp/scan.json --out /tmp/badge.svg
          /tmp/pk/bin/popia-kit supabase sql | grep -q popia_kit_inventory
          /tmp/pk/bin/popia-kit supabase check "$GITHUB_WORKSPACE/tests/fixtures/supabase/seeded-risky.json" --fail-on high && exit 1 || test $? -eq 1
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' | /tmp/pk/bin/popia-kit mcp > /tmp/mcp.out
          python -c "import json; r=[json.loads(l) for l in open('/tmp/mcp.out')]; assert len(r[1]['result']['tools']) == 8, r"

      - name: npx wrapper runs from a packed tarball
        run: |
          npm pack --pack-destination /tmp
          cd /tmp && npx -y ./popia-kit-*.tgz version && npx -y ./popia-kit-*.tgz scan "$GITHUB_WORKSPACE/tests/fixtures/demo-app" > /tmp/npx-scan.txt || true
          grep -q "summary:" /tmp/npx-scan.txt

  action:
    name: GitHub Action (one scan, baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Full scan reports findings
        id: full
        uses: ./
        with:
          path: tests/fixtures/demo-app
          fail-on: none
          upload-sarif: "false"

      - name: Write a baseline
        run: python3 scripts/popia_scan.py tests/fixtures/demo-app --write-baseline "$RUNNER_TEMP/popia-baseline.json"

      - name: Scan against the baseline
        id: base
        uses: ./
        with:
          path: tests/fixtures/demo-app
          baseline: ${{ runner.temp }}/popia-baseline.json
          fail-on: high
          upload-sarif: "false"

      - name: Check outputs
        env:
          FULL_HIGH: ${{ steps.full.outputs.high }}
          BASE_HIGH: ${{ steps.base.outputs.high }}
          SARIF: ${{ steps.full.outputs.sarif-file }}
        run: |
          test "$FULL_HIGH" -gt 0
          test "$BASE_HIGH" -eq 0
          test -s "$SARIF"

  supabase:
    name: Supabase check SQL on a throwaway Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Inventory query, rules and read-only session
        run: sudo -E env "PATH=$PATH" bash tests/supabase/run_live.sh

  site-check:
    name: Hosted site check (Deno, Node, SQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted/site-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: v2.x

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Format, lint and type check
        run: |
          deno fmt --check
          deno task lint
          deno task check

      - name: Unit tests (no network)
        run: deno task test

      - name: Node adapters
        run: |
          cd adapters && npm ci --no-audit --no-fund && cd ..
          deno task check:adapters
          cd adapters && npm test

      - name: Migration tests on a throwaway Postgres
        run: sudo -E bash tests/sql/run_sql_tests.sh
