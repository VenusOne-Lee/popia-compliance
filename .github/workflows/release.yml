name: Release

# Publishes popia-kit to PyPI and npm when a version tag is pushed, for example v1.1.0.
# No long-lived tokens: PyPI and npm both use trusted publishing (OpenID Connect).
# One-time setup is in docs/releasing.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Tag matches every version number
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PY=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          NPM=$(node -p "require('./package.json').version")
          CLI=$(python -c "import re; print(re.search(r'VERSION = \"([^\"]+)\"', open('scripts/cli.py').read()).group(1))")
          echo "tag=$TAG pyproject=$PY package.json=$NPM cli=$CLI"
          test "$TAG" = "$PY" && test "$TAG" = "$NPM" && test "$TAG" = "$CLI"

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -t .

      - name: Build sdist, wheel and npm tarball
        run: |
          python -m pip install "build==1.2.2.post1" "twine==6.1.0"
          python -m build
          python -m twine check --strict dist/*
          npm pack --pack-destination dist

      - name: Installed wheel works outside the repo
        working-directory: /tmp
        run: |
          python -m venv /tmp/pk
          /tmp/pk/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          /tmp/pk/bin/popia-kit version
          /tmp/pk/bin/popia-kit scan "$GITHUB_WORKSPACE/tests/fixtures/demo-app" --format json --out /tmp/scan.json || true
          python -c "import json; r=json.load(open('/tmp/scan.json')); assert r['files_scanned'] > 0, r"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/popia-kit/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Keep only the Python files
        run: rm -f dist/*.tgz

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    name: Publish to npm
    needs: build
    # Off until npm is set up. Turn on with a repository variable PUBLISH_NPM = true.
    if: vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/popia-kit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or newer. The first release of a new package
      # can't use it yet, so NPM_TOKEN is used when that secret exists. Delete the secret
      # after the first release and add the trusted publisher on npmjs.com.
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@11.6.2
          npm publish dist/popia-kit-*.tgz --provenance --access public

  github-release:
    name: GitHub release
    needs: [pypi, npm]
    # Runs when PyPI succeeded and npm either succeeded or was switched off.
    if: always() && needs.pypi.result == 'success' && (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Create the release with the built files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Install: pipx install popia-kit, or run uvx popia-kit scan . Engineering guidance, not legal advice."
