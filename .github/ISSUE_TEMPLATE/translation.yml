name: Translation review or new language
description: Review a draft translation or propose a new language.
labels: ["translation"]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes:
      label: Request
      options: ["Review a draft", "New language", "Correction"]
  - type: textarea
    id: notes
    attributes:
      label: Notes
