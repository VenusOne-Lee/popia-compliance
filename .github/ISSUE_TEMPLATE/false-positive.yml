name: False positive
description: A scanner, site check or Supabase check finding that looks wrong.
labels: ["false positive"]
body:
  - type: markdown
    attributes:
      value: |
        Findings are leads to review, so false positives help us tune the rules. Do not paste secrets, real ID numbers, card numbers or personal information. Replace them with fake values.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - Code scanner (popia-kit scan)
        - Site check (popia-kit site-check)
        - Site check on popiakit.co.za
        - Supabase check (popia-kit supabase)
        - MCP server
    validations: { required: true }
  - type: input
    id: rule
    attributes:
      label: Rule ID
      description: For example WEB-012 or SB-003. It is shown next to each finding.
    validations: { required: true }
  - type: textarea
    id: example
    attributes:
      label: Smallest example that triggers it
      description: A code snippet, a public URL, or the finding as reported. Remove anything sensitive.
      render: text
    validations: { required: true }
  - type: textarea
    id: why
    attributes:
      label: Why you think it is wrong
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `popia-kit version`, if you used the CLI.
